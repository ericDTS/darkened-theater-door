<style>
/* one black room, laid over whatever the template draws */
#dts {
  --ink: #0c0c0c; --paper: #e3e3e0; --dim: #6c6c69;
  --display: "Barlow Condensed", "DIN Condensed", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --dw: min(150px, 34vw); --dh: calc(var(--dw) * 2.1);
  --ease: cubic-bezier(.65, 0, .35, 1);
  position: fixed; inset: 0; z-index: 99999; overflow-y: auto; overflow-x: hidden;
  background: var(--ink); color: var(--paper); font-family: var(--display);
  display: grid; grid-template-rows: auto 1fr auto; color-scheme: dark;
  padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
  -webkit-font-smoothing: antialiased;
}
#dts * { box-sizing: border-box; }
#dts button, #dts input { font: inherit; color: inherit; }
#dts :focus-visible { outline: 1px solid var(--paper); outline-offset: 5px; }
#dts .meta { padding-block: 22px; display: flex; justify-content: space-between; gap: 12px; font: 400 10px/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
#dts .meta b { font-weight: 400; color: var(--paper); font-variant-numeric: tabular-nums; }
#dts .center { overflow-x: clip; display: grid; justify-items: center; align-content: center; padding-top: 12px; }

/* the door: a plain rectangle, ajar on its left edge */
#dts .door-wrap { position: relative; }
#dts .door { position: relative; display: block; width: var(--dw); height: var(--dh); background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
#dts .gap { position: absolute; top: 0; left: 0; height: 100%; width: var(--open, 0px); overflow: hidden; background: var(--paper); transition: width 1.3s var(--ease); }
#dts .leaf { position: absolute; top: 0; bottom: 0; right: 0; left: var(--open, 0px); background: linear-gradient(90deg, #131313, #0e0e0e 50%); transition: left 1.3s var(--ease); }
#dts .frame { position: absolute; inset: -1px -1px 0 -1px; border: 1px solid #1f1f1e; border-bottom: 0; pointer-events: none; }

/* the name on the floor, readable only where the light lands */
#dts .pool { width: var(--dw); height: 120px; position: relative; pointer-events: none; }
#dts .pool > * { position: absolute; top: 0; left: 0; }
#dts .light, #dts .lit { clip-path: polygon(0 0, var(--open, 0px) 0, calc(var(--open, 0px) * 8 + 16px) 100%, 0 100%); transition: clip-path 1.3s var(--ease); }
#dts .light { height: 100%; width: 600px; background: linear-gradient(180deg, rgba(227,227,224,.30), rgba(227,227,224,0)); }
#dts .name { height: 100%; width: 600px; margin: 0; padding: 62px 0 0 4px; font: 500 16px/1 var(--display); letter-spacing: .55em; text-transform: uppercase; white-space: nowrap; color: var(--paper); }
#dts .name.dim { opacity: .05; }
#dts .lit span { transition: opacity .5s var(--ease); transition-delay: calc(var(--i) * 140ms); }
#dts.out .lit span { opacity: 0; transition-delay: 0s; }
/* lights out: the sliver flickers and dies, and the room goes with it */
#dts.out .gap, #dts.out .light, #dts.out .lit { opacity: 0; animation: dts-flicker 1.1s steps(1, end); }
#dts .name.dim, #dts .frame, #dts .meta { transition: opacity .8s var(--ease); }
#dts.out .name.dim, #dts.out .frame { opacity: 0; transition-delay: .9s; }
#dts.out .meta { opacity: .1; transition-delay: 1.1s; }
@keyframes dts-flicker { 0% { opacity: 1; } 10% { opacity: .15; } 18% { opacity: 1; } 30% { opacity: .05; } 38% { opacity: .7; } 52% { opacity: 0; } 60% { opacity: .35; } 68%, 100% { opacity: 0; } }

/* door states */
#dts.ajar { --open: 7px; }
#dts.ajar.peek { --open: 64px; }
#dts.ajar.shut { --open: 0px; }
#dts.slam .gap, #dts.slam .leaf, #dts.slam .light, #dts.slam .lit { transition-duration: .18s; transition-timing-function: cubic-bezier(.7, 0, 1, 1); }

/* the knock */
#dts .knockzone { padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 12px; min-height: 120px; opacity: 0; transition: opacity 1s var(--ease) .3s; }
#dts.titled .knockzone { opacity: 1; }
#dts .knock { background: none; border: 0; border-bottom: 1px solid var(--dim); padding: 6px 2px; margin-right: -.5em; cursor: pointer; font: 500 14px/1 var(--display); letter-spacing: .5em; text-transform: uppercase; }
#dts .knock:hover { border-color: var(--paper); }
#dts .code { background: transparent; border: 0; border-bottom: 1px solid var(--dim); border-radius: 0; padding: 8px 0; width: 220px; max-width: 70vw; text-align: center; font: 500 18px/1 var(--display); letter-spacing: .5em; text-transform: uppercase; }
#dts .code:focus { outline: none; border-color: var(--paper); }
#dts .code::placeholder { color: var(--dim); }
#dts .reply { font: 400 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); min-height: 1.4em; text-align: center; transition: color .4s; }
#dts .reply.new { color: var(--paper); }
#dts .shake { animation: dts-shake .4s; }
@keyframes dts-shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

@media (max-width: 600px) { #dts .name { font-size: 13px; letter-spacing: .42em; } #dts.ajar.peek { --open: 48px; } }
@media (prefers-reduced-motion: reduce) { #dts *, #dts *::before, #dts *::after { transition: none !important; animation: none !important; } }
</style>

<div id="dts">

  <div class="center">
    <div class="door-wrap">
      <button class="door" id="dts-door" type="button" aria-label="Knock on the door">
        <span class="gap"></span>
        <span class="leaf"></span>

      <span class="frame" aria-hidden="true"></span>
    </div>
    <div class="pool">
      <div class="light" aria-hidden="true"></div>
      <div class="name dim" aria-hidden="true">Darkened Theater</div>
      <h1 class="name lit" id="dts-name" aria-label="Darkened Theater Studios">Darkened Theater</h1>
    </div>
  </div>

  <div class="knockzone">
    <button class="knock" id="dts-knock" type="button">Knock</button>
    <div class="reply" id="dts-reply" role="status"></div>
  </div>
</div>

  // unlocking: the typed word derives a key; its last half names the lock, its first half opens it
  var subtle = window.crypto && window.crypto.subtle;
  function norm(s) { return String(s).toUpperCase().replace(/\s+/g, ""); }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }
